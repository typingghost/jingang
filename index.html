、一次小失误较什么劲呢？","details":[]},{"label":"言哥心法","text":"把“完美主义”扔进垃圾桶！鲜活的人生本来就带着毛边和烟火气，允许自己偶尔犯点小迷糊、允许身材和年龄自然生长、允许方案先完成再迭代——当你不再逼自己当塑料橱窗里的完美假人，你整个人都在发光。","details":[]}]},{"id":21,"title":"收起你那套“爹味说教圣旨”，见招拆招才是真高手","points":[{"label":"人类迷惑行为","text":"家庭和职场里最让人窒息的沟通灾难，莫过于“真理在握型说教狂”：不管是伴侣吐槽工作累、还是下属汇报遇到卡点，他张嘴就是“我早就教过你一二三四五，你为什么不照我的标准语录办？！”把每一次聊天都开成批斗大会，还委屈得不行：“我这可全是为了点化你们这群糊涂虫啊！”","details":["以为自己掌握了宇宙唯一真理，拿一套死话术到处给人“上课”；","给身边人贴满“烂泥扶不上墙”的死标签，把活生生的人看扁看死。"]},{"label":"佛陀一针见血","text":"佛陀直接放话：“若人言如来有所说法，即为谤佛……说法者，无法可说，是名说法！”连释迦牟尼佛讲了一辈子经，都说自己从来没立过一套死板的教条！而且紧接着说“众生者，如来说非众生，是名众生”——没有任何人天生就是固定不变的糊涂虫，别拿死标签把人看死了。","details":[]},{"label":"言哥心法","text":"最高段的沟通叫“应病与药，病好药收”。在家里少摆大家长谱，在公司少打官腔背语录；针对眼前的具体问题给一句实在主意，事情解决了立马闭嘴翻篇，别把自己说过的话装裱起来逼人天天膜拜。","details":[]}]},{"id":22,"title":"别跟松鼠过冬似的瞎囤“焦虑课”了，真智慧是给脑子做断舍离","points":[{"label":"人类迷惑行为","text":"打开现代人的手机和收藏夹，简直是个大型“精神松鼠囤积现场”：买了八十个付费专栏没听完、收藏了五百篇《职场逆袭干货》吃灰、报了一堆修心打卡营，每天被“别人都在进步，我还没学到新东西”的恐慌追着跑；结果脑子里塞满了互相打架的二手道理，遇到真事儿反而比以前更纠结了。","details":["把“松鼠式囤课打卡”当成长，脑子塞得像晚高峰的三环路一样寸步难行；","连修心都在贪图“我得抓到个厉害法宝”，把贪心换了个马甲继续贪。"]},{"label":"佛陀一针见血","text":"须菩提单刀直入：“佛陀证得无上正等正觉，其实就是一无所得吗？”佛陀连声点赞：“如是！如是！我于阿耨多罗三藐三菩提，乃至无有少法可得，是名阿耨多罗三藐三菩提！”觉悟根本不是死死抓到了某件固定实有的神仙秘籍（无论心外还是心内），而是彻底放下对一切实有定法的执取，连一星半点“我有所得”的累赘都不留。","details":[]},{"label":"言哥心法","text":"智慧不是靠做加法囤出来的，是靠做减法筛出来的！关掉那些制造焦虑的贩卖机，把你脑子里“必须拥有X才算成功”的执念清掉一个是一个——心里空出一片地，清风明月自然就进来了。","details":[]}]},{"id":23,"title":"撕掉名利场的“鄙视链”价签，干干净净把好事做漂亮","points":[{"label":"人类迷惑行为","text":"世俗圈子最爱玩的游戏就是“全自动排座次”：进门先扫一眼对方背什么包、开什么车、坐什么职级，比自己高的就点头哈腰赔笑脸，比自己低的就鼻孔朝天爱答不理；哪怕偶尔做点公益善事，也要发九张带定位的精修大图，生怕别人不知道自己是“高人一等的大善人”。","details":["活在无处不在的“鄙视链”里，不是在仰视中自卑，就是在俯视中傲慢；","做点好事就死死攥着“善法”的道德高地，拿道德牌坊去压人。"]},{"label":"佛陀一针见血","text":"佛陀一锤定音：“是法平等，无有高下，是名阿耨多罗三藐三菩提！”在究竟的实相智慧面前，没有谁比谁更高贵，也没有谁比谁更低贱。同时佛陀嘱咐你：“以无我、无人、无众生、无寿者，修一切善法……所言善法者，如来说即非善法，是名善法。”既要热气腾腾地把世间一切好事做好，又不在心里立一块“我是大善人”的牌子。","details":[]},{"label":"言哥心法","text":"修出“平视世界”的硬骨头：在大人物面前不矮三分，在普通劳动者面前不高一寸。职场上认认真真交付价值，生活里痛痛快快与人分担温暖，做完拍拍衣袖不留酸腐气，这才是真正的人间贵气。","details":[]}]},{"id":24,"title":"把全宇宙的珠峰堆成金山，也买不来一颗不钻牛角尖的透亮心","points":[{"label":"人类迷惑行为","text":"很多人一辈子都在算小账：今天股票涨了三百块就眉开眼笑，明天丢了一百块或者奖金少发了五百就垂头丧气，觉得人生的幸福值全绑在计算器那几个数字上；可真遇到家庭变故、职场风波或者人际内耗时，平时算得精明无比的计算器当场报废，整个人陷入巨大的恐慌。","details":["算得清菜市场的一毛两毛，算不清自己一晚上失眠内耗亏掉了多少健康；","总以为物质堆得像山一样高就能高枕无忧，却忘了心眼若是堵死的，坐金山上照样窒息。"]},{"label":"佛陀一针见血","text":"佛陀把比喻推到了巅峰：就算把三千大千世界里所有的最高峰（须弥山王）全都换成七宝金山拿去布施，在受持、演说四句般若智慧的福德面前，“百分不及一，百千万亿分，乃至算数譬喻所不能及”！因为金山银山还在“加减乘除”的有限维度里，而一颗不被任何外相困死的通透心，直接跳出了三界内耗的牢笼。","details":[]},{"label":"言哥心法","text":"你手里最值钱的资产，从来不是哪个不动产证，而是你遇到烂事能三分钟翻篇、遇到顺境不飘、遇到逆境不垮的“般若脑子”。把这颗心磨亮，哪怕再给一座金山都不换！","details":[]}]},{"id":25,"title":"收起你那套“我是在拯救你”的爹味控制欲，没人欠你一座功德碑","points":[{"label":"人类迷惑行为","text":"人际关系里最让人想连夜买站票逃跑的，就是“自我感动型救世主”：在家里盯着伴侣和孩子的每一个动作指手画脚，在公司里抓着下属的衣服领子恨铁不成钢，口头禅永远是“我这辈子操碎了心全是为了度你、改造你”！一旦对方不听指挥，立马暴跳如雷；而到了自己犯懒或钻牛角尖时，又秒变缩头乌龟：“嗨，我就是个俗人凡夫，你别要求我改！”","details":["度人时把自己当高高在上的神仙，非要按自己的模子把别人捏扁搓圆；","护短自己时又把“我是凡夫”当免死金牌，死活不肯挪窝。"]},{"label":"佛陀一针见血","text":"佛陀直接把这两块遮羞布一块儿撕了：第一，“汝等勿谓如来作是念：我当度众生……实无有众生如来度者”，连佛陀都从不觉得是自己拯救了谁，因为每个人本来就有觉悟的佛性；第二，“凡夫者，如来说则非凡夫，是名凡夫”——根本没有一个焊死不变的“凡夫”铁壳子让你拿来当不长进的借口！","details":[]},{"label":"言哥心法","text":"对别人，收起“我要改造你”的控制欲，递完梯子就撒手，尊重别人自己的因果；对自己，撕掉“我天生就这样改不了”的死标签——没有谁被判了无期徒刑，只要你现在想通了，这一秒就能活成明白人。","details":[]}]},{"id":26,"title":"光看排场和甜言蜜语就掏心掏肺，你不踩坑谁踩坑？","points":[{"label":"人类迷惑行为","text":"骗子、职场大忽悠和渣男渣女固然坏透了顶，但为什么他们那套把戏总能找到猎物？因为太多善良人买东西、看人、找合作，一不小心就犯了“声控”和“颜控”的毛病：看对方西装革履、办公室租在顶级写字楼（以色见），听对方把大饼画得天花乱坠、一口一个“姐我最懂你”（以音声求），当场就晕头转向把底牌全交出去了；等被坏人坑得底裤都不剩，才拍着大腿哭诉人心险恶。","details":["连须菩提刚开始都差点顺嘴掉进“看三十二相认如来”的坑里；","只看包装盒印得漂不漂亮、广告词念得好不好听，唯独不打开盒子验货。"]},{"label":"佛陀一针见血","text":"佛陀当场给须菩提来了一记灵魂反问：“如果长着三十二相就是佛，那世间威风凛凛的转轮圣王不也成佛了？”紧接着甩出震烁古今的四句偈：“若以色见我，以音声求我，是人行邪道，不能见如来！”靠执着外在的形貌色相和声音言辞去寻求如来实相，这条路从根上就走偏了！","details":[]},{"label":"言哥心法","text":"在脑子里装个“声色过滤器”！职场里谁的PPT做得最花哨、话术最动听，你越要查他的底层数据和历史交付；生活里谁把好话说得像蜜糖一样满，你越要看他遇到真事儿时掏不掏真金白银。滤掉声色泡沫，才见真金。","details":[]}]},{"id":27,"title":"别拿“看破红尘”当懒汉挡箭牌，佛陀最烦甩手掌柜","points":[{"label":"人类迷惑行为","text":"总有一批“野生断章取义大师”，前二十六品听佛陀讲“破相、无住”，眼睛立马亮了：“太棒了！既然一切都是空相，那我明天不用早起上班了、欠的信用卡也不用还了、家里的油瓶倒了也不用扶了，谁催我干活我就跟谁讲《金刚经》！”把好端端的大乘智慧，硬生生曲解成了吃白食、不担责的流氓逻辑。","details":["遇到困难就祭出“反正都是空的”，把逃避现实包装成高深莫测；","非黑即白：要么死死抓着名利不放，要么一听说破执就掉进什么都不干的“断灭坑”。"]},{"label":"佛陀一针见血","text":"佛陀早就防着这帮偷懒耍滑的家伙了，在这一品连敲三记警钟：“莫作是念！……发阿耨多罗三藐三菩提心者，于法不说断灭相！”破除执相是让你心里不长毒瘤，绝不是说世间因果断灭、什么努力都白费！真正的觉悟者，恰恰是在世间踏踏实实修善因、结善果，半点不糊弄。","details":[]},{"label":"言哥心法","text":"想拿佛经当摆烂遮羞布的可以醒醒了！真正的通透是“心里不拧巴，手上超能打”——锅照刷、钱照赚、责任照担，只是干活的时候不再带着一肚子怨气和焦虑，这才是正道。","details":[]}]},{"id":28,"title":"好日子大大方方享，但别让“功劳簿”把你拴成看门狗","points":[{"label":"人类迷惑行为","text":"人在逆境里咬牙挺过来不难，难的是顺境里“不飘、不贪、不被架住”：有的人在公司立了一功、或者在家里做了一件大好事，从此就把这张功劳簿塑封起来天天挂在嘴边，别人稍微少给点掌声就觉得被亏待了；还有的人攒下一点家业或名声，就整天提心吊胆怕丢、怕别人惦记，活生生把自己从财富的主人熬成了替财物看门的保安。","details":["把过去的功劳当成吃一辈子的老本，贪恋那点掌声不肯翻篇；","以为“不受福德”是叫人去过苦行僧日子，结果要么假清高、要么真贪婪。"]},{"label":"佛陀一针见血","text":"须菩提追问什么叫“不受福德”，佛陀给出了最潇洒的解释：“菩萨所作福德，不应贪着，是故说：不受福德！”通达一切法无我、于无我实相深信安住（得成于忍）的菩萨，好事做尽、福报自然来，但他心里绝不贪恋、不死抓着那些福德不放。不贪着，福气才不会变成拴住你的金锁链。","details":[]},{"label":"言哥心法","text":"职场上该拿的奖金大大方方揣进兜里，生活里该享的清福痛痛快快去享；但享受完一抹嘴，心里半点不粘滞、随时能归零重新出发。拿得起顶配好日子，也放得下任何老功劳，谁也拿捏不了你！","details":[]}]},{"id":29,"title":"日程表可以飞起，但你心里的定海神针一毫米都别晃","points":[{"label":"人类迷惑行为","text":"你看办公室和家里那些“人形龙卷风”：接个电话就开始跺脚叹气，出个差就像逃荒一样鸡飞狗跳，只要手头同时有两件事，方圆十米之内的人都得跟着他一起血压升高。你问他干嘛这么慌，他还理直气壮：“事儿这么多我能不乱吗？！”——身体在跑，魂儿早就不知道飞哪儿去了。","details":["外面稍微刮点风，心里立刻掀起十二级海啸；","把“手忙脚乱、情绪失控”当成工作努力的证明。"]},{"label":"佛陀一针见血","text":"佛陀说：“若有人言：如来若来、若去；若坐、若卧，是人不解我所说义。何以故？如来者，无所从来，亦无所去，故名如来。”如来法身（真如实相）本无来去生灭，根本不能拿来去坐卧的身体表相去死死框定！借这层“不执动静来去之相”的智慧照进生活，哪怕外头千军万马奔腾，也别被表面的忙乱相把魂儿勾跑了。","details":[]},{"label":"言哥心法","text":"练出“台风眼”体质：外面的业务再忙、行程再满，你心底那个核心主控室永远安安静静。手脚麻利地干活，呼吸平稳地说话，哪怕天塌下来也是先把茶杯盖好再起身处理——这气场一立住，烂事见了你都得绕道。","details":[]}]},{"id":30,"title":"别把临时拼起来的乐高积木，当成砸不碎的铁打江山","points":[{"label":"人类迷惑行为","text":"人类最爱干的蠢事，就是把一堆临时凑合起来的条件，脑补成一个永远拆不开的“实心铁疙瘩（一合相）”：遇到一个大项目卡壳，就抱头哀嚎“这事儿彻底没救了”；跟伴侣或同事闹了一点分歧，就立地宣布“我们三观完全不合、彻底玩完”；把暂时的困难当成焊死的铁板，自己蹲在铁板底下哭天抢地。","details":["凡夫贪着其事：非要把流动的组合当成铁板一块的死局；","不肯把大问题拆成小颗粒，只会在宏观层面搞情绪崩溃。"]},{"label":"佛陀一针见血","text":"佛陀直接拿大锤把三千大千世界砸成微尘给你看：微尘不是固定实有的死疙瘩，世界也不是铁板一块的“一合相”！“一合相者，则是不可说，但凡夫之人，贪着其事。”世上所有的公司、圈子、难题和关系，全都是众多微尘因缘临时拼起来的乐高积木，并没有一个焊死不变的实有整体；别再“贪着其事”死揪着不放，自己把自己锁死在牛角尖里！","details":[]},{"label":"言哥心法","text":"遇到看起来像座大山一样的烂摊子，立刻启动“微尘拆解术”：别对着整座山发愁，拿把小铲子把它拆成今天上午能打完的一个电话、下午能改完的一页表格。把铁板拆成乐高，天底下就没有破不了的局！","details":[]}]},{"id":31,"title":"别拿着鸡毛掸子跟自己的念头打架了，看清它是影子就够了","points":[{"label":"人类迷惑行为","text":"有些人学了点防内耗心法，结果活得比以前更累了：每天在脑子里装八个监控探头，只要自己偶尔生了一点小闷气、起了一点小虚荣，立刻拿大棒子敲自己的头：“天呐！我怎么又动我见了！我怎么这么不洒脱！我白修了我真该死！”——原本只是冒了个普通念头，硬是靠“自我审查”叠加出了双倍内耗！","details":["把“破执”当成了新教条（生起法相），天天跟自己脑子里的影子挥剑决斗；","不允许自己有一丁点正常人的情绪波动，把自己逼成了紧绷的机器人。"]},{"label":"佛陀一针见血","text":"佛陀在收官前温柔地替你卸下最后一层盔甲：“世尊说我见、人见、众生见、寿者见，即非我见、人见、众生见、寿者见，是名我见、人见、众生见、寿者见……于一切法，应如是知、如是见、如是信解，不生法相。”连你脑子里冒出来的偏见和执念，本身也是空无实体的假名！看清它是个纸老虎就完了，千万别再立一个“我必须消灭执念”的新执念（法相）。","details":[]},{"label":"言哥心法","text":"跟自己的小心思和平相处！脑子里偶尔冒出点嫉妒、委屈或虚荣，就像街上路过一只冲你叫唤的小狗，你看它一眼笑一笑：“知道啦，忙你的去吧”，既不用撲上去咬它，更不用怪自己为什么会遇见狗。松弛下来，才叫真懂经。","details":[]}]},{"id":32,"title":"看透职场与人生的草台班子幻象，才敢满场飞奔地痛快活","points":[{"label":"人类迷惑行为","text":"人类对待这辈子通常只有两种极端死法：要么把眼前的铁饭碗、KPI 排名、别人的客套奉承当成永垂不朽的传家宝，稍微遇到点行业洗牌或人走茶凉就哭天抢地觉得人生完蛋了；要么听见“梦幻泡影”四个字就两眼放光，立刻拿佛经当懒汉遮羞布——碗也不刷了、班也不好好上了，美其名曰“看破红尘”，实则是逃避责任的精致摆烂。","details":["顺境时把平台的光环当成自己的永恒本事，死抓着名利相不撒手；","逆境时把一时的挫折当成终审判决，或者干脆缩进壳里当咸鱼。"]},{"label":"佛陀一针见血","text":"“一切有为法，如梦幻泡影，如露亦如电”——佛陀用六个比喻给你做终极减压：世间一切靠条件凑合起来的局面（有为法），全都在流动变化，没有哪块乌云能永远停在你头顶。正因为看清了得失成败不是焊死的铁板，你的心才能“不取于相，如如不动”，既不被顺境捧晕，也不被逆境砸垮。","details":[]},{"label":"言哥心法","text":"把人生当成一场限时买票进场的沉浸式大片：在场的时候，工作认真干、身边人用力爱、火锅热气腾腾地吃；遇到烂剧情不钻牛角尖；你看经文最后写的是“皆大欢喜，信受奉行”——合上经书，高高兴兴赚钱、吃饭、睡好觉去！","details":[]}]}]</script>
<script>
(function () {
  const PREF = (k) => { try { const q = new URLSearchParams(location.search).get(k); if (q !== null) { localStorage.setItem('jingang.pref.' + k, q); return q; } return localStorage.getItem('jingang.pref.' + k); } catch (e) { return null; } };
  const WHO = ((PREF('to') || '').trim() || '亲爱的你们').slice(0, 8);
  const chapters = JSON.parse(document.getElementById('chapters-data').textContent);
  chapters.forEach(c => { c.original = c.dialogue.map(d => d.text).join(''); });
  const toxic = JSON.parse(document.getElementById('toxic-data').textContent);
  const byId = Object.fromEntries(chapters.map(c => [c.id, c]));
  const toxicById = Object.fromEntries(toxic.map(t => [t.id, t]));

  // 八期音频：四卷，每期四品（计划 v1）。App 版音频在 assets/audio/，网页预览里不带音频
  const AUDIO_ON = true;
  const JUAN = ['破相入门', '无住生心', '三心皆空', '梦幻泡影'];
  const topics = [
    { name: '发票', title: '穿衣吃饭皆是修行，帮人别留高利贷发票', sub: '付出越多越委屈，是因为心里攥着发票' },
    { name: '虚妄', title: '凡所有相皆是虚妄，别被名头和外相唬住', sub: '佛法是过河的船，过了河别背着走' },
    { name: '无住', title: '给大脑清空缓存：应无所住，而生其心', sub: '事来照得清楚，事过不留残影' },
    { name: '无我', title: '拆掉"自我"靶子：忍辱仙人为什么不生气', sub: '一句重话为什么能气你三天' },
    { name: '三心', title: '停止反刍过去与透支未来：三心不可得', sub: '翻旧账和提前焦虑，都抓不住' },
    { name: '平等', title: '是法平等，无有高下', sub: '别拿死规矩困死活人' },
    { name: '不贪', title: '不受不贪：最高级的福气', sub: '心里不攥着，才是真富足' },
    { name: '泡影', title: '如梦幻泡影：看透剧本，全情投入', sub: '在场时热泪盈眶，散场时潇洒起身' },
  ];
  // 八期音频的真实时长（秒），11/6 NotebookLM 成品
  const AUDIO_SECS = [1191, 1009, 1275, 864, 1228, 1416, 997, 967];
  topics.forEach((t, i) => {
    t.id = 'vol' + (i + 1);
    t.juan = JUAN[Math.floor(i / 2)];
    t.vol = `第${'一二三四'[Math.floor(i / 2)]}卷 · 第${'一二三四五六七八'[i]}期`;
    t.audio = `audio/${t.id}.m4a`;
    t.chapters = [1, 2, 3, 4].map(n => i * 4 + n);
    t.dur = AUDIO_SECS[i];
  });
  const topicOf = {};
  topics.forEach(t => t.chapters.forEach(id => { topicOf[id] = t; }));
  const DRESSES = [
    { cls: 's-a', name: '竹简' },
    { cls: 's-b', name: '朱丝栏' },
    { cls: 's-c', name: '夜读' },
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem('jingang.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('jingang.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const state = {
    view: 'today', chapterId: null, topicId: null, query: '',
    tone: store.get('tone', 'gentle'),
    dress: store.get('dress', 1),
    scale: store.get('scale', 0),
    favs: new Set(store.get('favs', [])),
    speed: store.get('speed', 1),
  };

  const NUM = '零一二三四五六七八九';
  function cnum(n) {
    if (n < 10) return NUM[n];
    if (n < 20) return '十' + (n % 10 ? NUM[n % 10] : '');
    return NUM[Math.floor(n / 10)] + '十' + (n % 10 ? NUM[n % 10] : '');
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const dou = s => esc(s).replace(/([，。；：！？、])/g, '<i class="dou">$1</i>');
  function clauses(text) { return text.match(/[^，。；：！？]+[，。；：！？]?/g) || [text]; }
  function slipsOf(text) {
    const out = [];
    for (const c of clauses(text)) {
      for (let i = 0; i < c.length; i += 12) out.push(c.slice(i, i + 12));
    }
    return out;
  }
  function sentences(text) { return text.match(/[^。；！？]+[。；！？]?/g) || [text]; }

  function todayChapter() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const day = Math.floor((now - start) / 86400000);
    return byId[(day % 32) + 1];
  }
  function dateLine() {
    const d = new Date();
    const wk = '日一二三四五六'[d.getDay()];
    return `${cnum(d.getMonth() + 1)}月${d.getDate() <= 10 ? '初' + cnum(d.getDate()) : cnum(d.getDate())}日 · 星期${wk}`;
  }
  function pickSituations(n) {
    const pool = [];
    chapters.forEach(c => c.situations.forEach(s => pool.push([s, c.id])));
    const seed = new Date().getDate();
    const out = [];
    for (let i = 0; i < n; i++) out.push(pool[(seed * 37 + i * 101) % pool.length]);
    return out;
  }

  function applyDress() {
    document.body.classList.remove('s-a', 's-b', 's-c');
    document.body.classList.add(DRESSES[state.dress].cls);
    document.documentElement.style.setProperty('--fs', (18 + state.scale * 2) + 'px');
    // 在 App 里顺便把系统状态栏、导航栏染成同色
    const bars = [['#F1E8D6', true], ['#F4F1EA', true], ['#121417', false]][state.dress];
    try { window.Weiran && window.Weiran.setBars(bars[0], bars[1]); } catch (e) {}
  }
  function dressBtn() {
    return `<button class="dress" data-act="dress">装帧 <b>${DRESSES[state.dress].name}</b> · 换</button>`;
  }

  function viewToday() {
    const c = todayChapter();
    const sit = pickSituations(4);
    return `
      <div class="head-painting" aria-hidden="true">
        <canvas id="head-canvas"></canvas>
        <div class="fog f1"></div><div class="fog f2"></div>
      </div>
      <div class="topbar over"><span>未然 · 金刚</span>${dressBtn()}</div>
      <section class="hero">
        <div>
          <div class="hero-date">${dateLine()}</div>
          <h1 class="hero-hi">${esc(WHO)}，今天读第${cnum(c.id)}品。</h1>
        </div>
        <div class="hero-name" aria-hidden="true">金刚</div>
      </section>
      <article class="today">
        <div class="today-head"><span class="seal">${cnum(c.id)}</span><span>${esc(c.title)}</span></div>
        <p class="today-quote">${dou(c.excerpt)}</p>
        <button class="btn-ink" data-open="${c.id}">读这一品</button>
      </article>
      <div class="section-label">今天只做一步</div>
      <p class="step-line">${esc(c.step)}</p>
      <div class="section-label">按心事找</div>
      <div class="chips">${sit.map(([s, id]) => `<button class="chip" data-open="${id}">${esc(s)}</button>`).join('')}</div>
      <div class="offline-all"><button id="cache-all" type="button">全部存到本机，断网也能听</button></div>${DEDICATION.length ? '<div class="dedication"><button data-act="dedic">深海基地全员 赠 ›</button></div>' : ''}`;
  }

  function matches(c, q) {
    if (!q) return true;
    const hay = [c.title, c.original, c.translation, c.themes.join(' '), c.keywords.join(' '), c.situations.join(' '), cnum(c.id), String(c.id)].join(' ');
    return hay.includes(q);
  }
  function viewToc(onlyFav) {
    const list = chapters.filter(c => (!onlyFav || state.favs.has(c.id)) && matches(c, state.query.trim()));
    const title = onlyFav ? '收藏' : '目录';
    const sub = onlyFav ? '读到心里的品，都在这里。' : '三十二品。可以搜字，也可以搜心事，比如"委屈""放不下"。';
    const body = list.length
      ? `<ul class="toc">${list.map(c => `<li><button data-open="${c.id}"><span class="num">第${cnum(c.id)}品${state.favs.has(c.id) ? ' <span class="fav-dot">●</span>' : ''}</span><span class="ttl">${esc(c.title)}</span></button></li>`).join('')}</ul>`
      : `<p class="empty">${onlyFav ? '还没有收藏。读的时候点右上角的"藏"。' : '没找到。换个词试试。'}</p>`;
    return `
      <div class="topbar"><span>未然 · 金刚</span>${dressBtn()}</div>
      <h1 class="page-title">${title}</h1>
      <p class="page-sub">${sub}</p>
      ${onlyFav ? '' : `<input class="search" id="search" type="search" placeholder="搜一个字，或一件心事" value="${esc(state.query)}" autocomplete="off">`}
      <div id="toc-list">${body}</div>`;
  }

  const spk = n => n === '叙述' ? '' : n;
  function originalBlock(c) {
    let body;
    if (state.dress === 0) {
      body = `<div class="slips-wrap"><div class="slips">${c.dialogue.map(d => (spk(d.speaker) ? `<div class="slip slip-spk">${d.speaker}</div>` : '') + slipsOf(d.text).map(x => `<div class="slip">${dou(x)}</div>`).join('')).join('')}</div></div>`;
    } else if (state.dress === 1) {
      body = `<div class="zhusi-wrap"><div class="zhusi">${c.dialogue.map(d => (spk(d.speaker) ? `<span class="spk">${d.speaker}</span>` : '') + dou(d.text)).join('')}</div></div>
        <div class="banxin"><span>未然 · 金刚</span><span>第${cnum(c.id)}品</span></div>`;
    } else {
      body = `<div class="lines">${c.dialogue.map(d => `<div class="turn">${spk(d.speaker) ? `<span class="spk">${d.speaker}</span>` : ''}${sentences(d.text).map(x => `<p>${dou(x)}</p>`).join('')}</div>`).join('')}</div>`;
    }
    return body + formulaBlock(c);
  }
  // 三段论小印章：点开看这一处的大白话
  function formulaBlock(c) {
    if (!c.formula_notes.length) return '';
    return `<div class="formula">${c.formula_notes.map(f => `<details><summary><span class="stamp">破</span>${esc(f.phrase)}</summary><p>${esc(f.note)}</p></details>`).join('')}</div>`;
  }
  function gentleBlock(c) {
    return `
      <div class="block"><h3>白话</h3><p>${esc(c.translation)}</p></div>
      <div class="block"><h3>放到此刻</h3><p>${esc(c.application)}</p></div>
      <div class="block"><h3>别把它用歪</h3><p>${esc(c.caution)}</p></div>
      <div class="block"><h3>今天只做一步</h3><p>${esc(c.step)}</p></div>
      <div class="block ask"><h3>问问自己</h3><p>${esc(c.reflection)}</p></div>`;
  }
  function sharpBlock(c) {
    const t = toxicById[c.id];
    if (!t) return '<p class="empty">这一品言哥还没来得及毒舌。</p>';
    return `
      <div class="sharp-title">${esc(t.title)}</div>
      <ul class="sharp-list">${t.points.map(p => `<li>${p.label ? `<b class="sharp-label">${esc(p.label)}</b>` : ''}${esc(p.text)}${p.details.length ? `<ul>${p.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}</li>`).join('')}</ul>`;
  }
  function viewChapter() {
    const c = byId[state.chapterId];
    const fav = state.favs.has(c.id);
    return `
      <div class="topbar"><button class="back" data-act="back">‹ 返回</button>${dressBtn()}</div>
      <header class="ch-head">
        <span class="seal">第${cnum(c.id)}品</span>
        <h1 class="ch-title">${esc(c.title)}</h1>
        <div class="ch-tools">
          <button class="icon-btn" data-act="smaller" aria-label="字小一点">小</button>
          <button class="icon-btn" data-act="bigger" aria-label="字大一点">大</button>
          <button class="icon-btn ${fav ? 'on' : ''}" data-act="fav" aria-pressed="${fav}">${fav ? '已藏' : '藏'}</button>
        </div>
      </header>
      ${originalBlock(c)}
      <div class="tone" role="group" aria-label="解读口吻">
        <button data-tone="gentle" aria-pressed="${state.tone === 'gentle'}">温柔</button>
        <button data-tone="sharp" aria-pressed="${state.tone === 'sharp'}">毒舌</button>
      </div>
      ${state.tone === 'gentle' ? gentleBlock(c) : sharpBlock(c)}
      ${topicOf[c.id] ? `<button class="in-topic" data-topic="${topicOf[c.id].id}">收录于 <b>${topicOf[c.id].vol}</b> · ${topicOf[c.id].title} ›</button>` : ''}
      ${c.reviewStatus !== 'reviewed' ? '<p class="draft-note">这一品的解读还是初稿，会再润色。</p>' : ''}
      <div class="pager">
        <button data-open="${c.id - 1}" ${c.id === 1 ? 'disabled' : ''}>‹ 第${cnum(Math.max(1, c.id - 1))}品</button>
        <button data-open="${c.id + 1}" ${c.id === 32 ? 'disabled' : ''}>第${cnum(Math.min(32, c.id + 1))}品 ›</button>
      </div>`;
  }

  function topicMeta(t) {
    const heard = positions[t.id] || 0;
    const mins = `约 ${Math.round(t.dur / 60)} 分钟`;
    return heard > 5 ? `${mins} · 听到 ${fmt(heard)}` : mins;
  }
  function viewTopics() {
    return `
      <div class="topbar"><span>未然 · 金刚</span>${dressBtn()}</div>
      <h1 class="page-title">专题</h1>
      <p class="page-sub">四卷八期，每期讲四品。可以边听边翻书，退出再进来会接着上次的地方。</p>
      ${topics.map((t, i) => `${i % 2 === 0 ? `<div class="section-label">${t.vol.slice(0, 3)} · ${t.juan}</div>` : ''}<button class="topic" data-topic="${t.id}"><span class="t-name">${t.name}</span><span><p>${t.vol}</p><h3>${t.title}</h3><p>${t.sub}</p><p class="t-meta">${topicMeta(t)}</p></span></button>`).join('')}`;
  }
  function viewTopic() {
    const t = topics.find(x => x.id === state.topicId);
    const here = current === t.id;
    const cur = here ? audio.currentTime : (positions[t.id] || 0);
    const dur = here && isFinite(audio.duration) ? audio.duration : t.dur;
    const playing = here && !audio.paused;
    const chapterList = `<div class="section-label">这一期读的四品</div>
         <ul class="toc">${t.chapters.map(id => `<li><button data-open="${id}"><span class="num">第${cnum(id)}品</span><span class="ttl">${esc(byId[id].title)}</span></button></li>`).join('')}</ul>`;
    const player = AUDIO_ON ? `
      <div class="player">
        <button class="play" data-act="play" aria-label="${playing ? '暂停' : '播放'}" id="pp-btn">${playing ? '❚❚' : '▶'}</button>
        <div>
          <div class="player-title">${t.vol} · ${t.title}</div>
          <input class="seek" id="pp-seek" type="range" min="0" max="${Math.round(dur)}" step="1" value="${Math.round(cur)}" aria-label="播放进度">
          <div class="times"><span id="pp-cur">${fmt(cur)}</span><span>${fmt(dur)}</span></div>
        </div>
        <div class="player-row">
          <button data-act="back15">退 15 秒</button>
          <button data-act="speed" id="pp-speed">${state.speed} 倍速</button>
          <button data-act="fwd30">进 30 秒</button>
        </div>
      </div>` : `
      <div class="player">
        <button class="play" disabled aria-label="播放">▶</button>
        <div><div class="player-title">${t.vol} · ${t.title}</div><small>网页预览不带音频，装好 App 就能听，约二十多分钟。</small></div>
      </div>`;
    return `
      <div class="topbar"><button class="back" data-act="back">‹ 返回</button>${dressBtn()}</div>
      <p class="page-sub" style="margin:18px 0 0">${t.vol}</p>
      <h1 class="page-title" style="margin-top:2px">${t.title}</h1>
      <p class="page-sub">${t.sub}</p>
      ${player}
      ${chapterList}`;
  }

  const headImg = new Image();
  headImg.src = HEAD_SRC;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let headPlayed = false;

  function fbm(w, h) {
    const out = new Float32Array(w * h);
    let amp = 1, total = 0;
    for (const cells of [4, 9, 19, 37]) {
      const gx = cells + 2, gy = Math.ceil(cells * h / w) + 2;
      const g = new Float32Array(gx * gy);
      for (let i = 0; i < g.length; i++) g[i] = Math.random();
      for (let y = 0; y < h; y++) {
        const fy = y / w * cells, iy = fy | 0, ty = fy - iy, sy = ty * ty * (3 - 2 * ty);
        for (let x = 0; x < w; x++) {
          const fx = x / w * cells, ix = fx | 0, tx = fx - ix, sx = tx * tx * (3 - 2 * tx);
          const a = g[iy * gx + ix], b = g[iy * gx + ix + 1], c = g[(iy + 1) * gx + ix], d = g[(iy + 1) * gx + ix + 1];
          out[y * w + x] += amp * ((a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy);
        }
      }
      total += amp; amp *= 0.5;
    }
    for (let i = 0; i < out.length; i++) out[i] /= total;
    return out;
  }

  function paintHead() {
    const cv = document.getElementById('head-canvas');
    if (!cv) return;
    if (!headImg.complete || !headImg.naturalWidth) { headImg.onload = paintHead; return; }
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = Math.max(1, Math.round(rect.width * dpr)), H = Math.max(1, Math.round(rect.height * dpr));
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const draw = () => {
      const ir = headImg.naturalWidth / headImg.naturalHeight, cr = W / H;
      let sw, sh, sx, sy;
      if (ir > cr) { sh = headImg.naturalHeight; sw = sh * cr; sx = (headImg.naturalWidth - sw) / 2; sy = 0; }
      else { sw = headImg.naturalWidth; sh = sw / cr; sx = 0; sy = (headImg.naturalHeight - sh) * 0.75; }
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(headImg, sx, sy, sw, sh, 0, 0, W, H);
    };
    if (headPlayed || reducedMotion) { draw(); return; }
    headPlayed = true;
    // 动画期间按 1 倍像素算（画本来就是淡彩，看不出差别），演完再按高清重画
    const fullW = W, fullH = H;
    W = Math.max(1, Math.round(rect.width)); H = Math.max(1, Math.round(rect.height));
    cv.width = W; cv.height = H;
    draw();
    const src = ctx.getImageData(0, 0, W, H).data;
    const out = ctx.createImageData(W, H), od = out.data;
    for (let i = 0; i < src.length; i += 4) { od[i] = src[i]; od[i + 1] = src[i + 1]; od[i + 2] = src[i + 2]; od[i + 3] = 0; }
    const S = 2, w = Math.ceil(W / S), h = Math.ceil(H / S);
    const n = fbm(w, h), v = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      v[y * w + x] = n[y * w + x] * 0.55 + (1 - x / w) * 0.38 + (y / h) * 0.07;
    }
    const EDGE = 0.22, DUR = 3200;
    let elapsed = 0, last = performance.now();
    ctx.clearRect(0, 0, W, H);
    function frame(now) {
      if (!document.body.contains(cv)) return;
      elapsed += Math.min(now - last, 50);  // 慢手机上宁可演慢一点，也不跳过
      last = now;
      const t = Math.min(1, elapsed / DUR);
      const f = (t * t * (3 - 2 * t)) * (1 + EDGE) ;
      for (let y = 0; y < H; y++) {
        const row = ((y / S) | 0) * w;
        for (let x = 0; x < W; x++) {
          let a = (f - v[row + ((x / S) | 0)]) / EDGE;
          a = a <= 0 ? 0 : a >= 1 ? 1 : a * a * (3 - 2 * a);
          od[(y * W + x) * 4 + 3] = a * 255;
        }
      }
      ctx.putImageData(out, 0, 0);
      if (t < 1) requestAnimationFrame(frame);
      else { W = fullW; H = fullH; cv.width = W; cv.height = H; draw(); }
    }
    requestAnimationFrame(frame);
  }

  // ---------- 播放器：全局一个 audio，换页不中断；每期记住听到哪 ----------
  const audio = document.getElementById('audio');
  const mini = document.getElementById('mini');
  const positions = store.get('positions', {});
  let current = null, lastSave = 0;
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }
  function savePos(force) {
    if (!current) return;
    if (!force && Date.now() - lastSave < 3000) return;
    positions[current] = audio.ended ? 0 : audio.currentTime;
    store.set('positions', positions);
    lastSave = Date.now();
  }
  function load(t) {
    if (current === t.id) return;
    savePos(true);
    current = t.id;
    audio.src = t.audio;
    audio.playbackRate = state.speed;
    const start = positions[t.id] || 0;
    audio.addEventListener('loadedmetadata', function once() {
      audio.removeEventListener('loadedmetadata', once);
      if (start > 0 && start < audio.duration - 5) audio.currentTime = start;
    });
  }
  function toggle(t) {
    load(t);
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }
  function syncPlayer() {
    const btn = document.getElementById('pp-btn');
    const here = state.view === 'topic' && state.topicId === current;
    if (btn && here) {
      btn.textContent = audio.paused ? '▶' : '❚❚';
      btn.setAttribute('aria-label', audio.paused ? '播放' : '暂停');
      const seek = document.getElementById('pp-seek');
      if (seek && document.activeElement !== seek) {
        if (isFinite(audio.duration)) seek.max = Math.round(audio.duration);
        seek.value = Math.round(audio.currentTime);
      }
      const cur = document.getElementById('pp-cur');
      if (cur) cur.textContent = fmt(audio.currentTime);
    }
    const t = topics.find(x => x.id === current);
    const showMini = !!t && !here && (!audio.paused || audio.currentTime > 0);
    mini.hidden = !showMini;
    document.body.classList.toggle('has-mini', showMini);
    if (showMini) {
      mini.innerHTML = `<div><button class="mini-title" data-topic="${t.id}">${t.vol} · ${t.title}<small>${fmt(audio.currentTime)}</small></button>
        <button class="play" data-act="mini-play" aria-label="${audio.paused ? '播放' : '暂停'}">${audio.paused ? '▶' : '❚❚'}</button></div>`;
    }
  }
  audio.addEventListener('timeupdate', () => { savePos(false); syncPlayer(); });
  audio.addEventListener('play', syncPlayer);
  audio.addEventListener('pause', () => { savePos(true); syncPlayer(); });
  audio.addEventListener('ended', () => { savePos(true); syncPlayer(); });
  document.addEventListener('input', e => {
    if (e.target.id !== 'pp-seek') return;
    const t = topics.find(x => x.id === state.topicId);
    load(t);
    audio.currentTime = +e.target.value;
    document.getElementById('pp-cur').textContent = fmt(+e.target.value);
  });

  // ---------- 献词 ----------
  // 澈哥想的，VV 11/6 定；和道德经那份献词是一对
  const DEDICATION = ['愿你心有所爱，而无所执；', '行过人间万象，依然自在。'];
  const dedic = document.getElementById('dedic');
  let dedicOpen = false;
  function openDedication() {
    dedicOpen = true;
    dedic.innerHTML = `
      <div class="dedic-inner">
        <div class="dedic-to">赠${esc(WHO)}</div>
        <div class="dedic-text">${DEDICATION.map(l => `<p>${dou(l)}</p>`).join('')}</div>
        <div class="dedic-sign"><span>深海基地全员</span><span class="seal">深海</span></div>
        <button class="btn-ink" data-act="dedic-close">翻开</button>
      </div>`;
    dedic.classList.remove('closing');
    dedic.hidden = false;
  }
  function closeDedication(then) {
    store.set('dedicated', true);
    dedic.classList.add('closing');
    setTimeout(() => {
      dedic.hidden = true;
      dedic.innerHTML = '';
      dedicOpen = false;
      if (then) then(); else if (state.view === 'today') render(false);
    }, reducedMotion ? 0 : 800);
  }

  const history = [];
  function go(view, extra) {
    history.push({ view: state.view, chapterId: state.chapterId, topicId: state.topicId });
    Object.assign(state, { view }, extra || {});
    if (view === 'chapter') store.set('last', state.chapterId);
    render(true);
  }
  function back() {
    const prev = history.pop() || { view: 'today' };
    Object.assign(state, prev);
    render(true);
  }

  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  function render(scrollTop) {
    applyDress();
    const v = state.view;
    app.innerHTML = v === 'today' ? viewToday() : v === 'toc' ? viewToc(false) : v === 'fav' ? viewToc(true)
      : v === 'chapter' ? viewChapter() : v === 'topics' ? viewTopics() : viewTopic();
    const tab = v === 'chapter' ? null : v === 'topic' ? 'topics' : v;
    tabs.innerHTML = [['today', '今日'], ['toc', '目录'], ['topics', '专题'], ['fav', '收藏']]
      .map(([k, n]) => `<button data-tab="${k}" ${tab === k ? 'aria-current="page"' : ''}>${n}</button>`).join('');
    const search = document.getElementById('search');
    if (search) search.addEventListener('input', () => {
      state.query = search.value;
      const html = viewToc(false);
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      document.getElementById('toc-list').innerHTML = tmp.querySelector('#toc-list').innerHTML;
    });
    app.classList.remove('enter');
    if (scrollTop) {
      void app.offsetWidth;
      app.classList.add('enter');
      window.scrollTo(0, 0);
    }
    if (v === 'today' && !dedicOpen) paintHead();
    syncPlayer();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('button');
    if (!el) return;
    if (el.dataset.open) { const id = +el.dataset.open; if (byId[id]) go('chapter', { chapterId: id }); return; }
    if (el.dataset.tab) { history.length = 0; Object.assign(state, { view: el.dataset.tab }); render(true); return; }
    if (el.dataset.topic) { go('topic', { topicId: el.dataset.topic }); return; }
    if (el.dataset.tone) { state.tone = el.dataset.tone; store.set('tone', state.tone); render(false); return; }
    const act = el.dataset.act;
    const topicNow = topics.find(x => x.id === state.topicId);
    if (act === 'play') { toggle(topicNow); return; }
    if (act === 'mini-play') { audio.paused ? audio.play().catch(() => {}) : audio.pause(); return; }
    if (act === 'back15' || act === 'fwd30') {
      load(topicNow);
      audio.currentTime = Math.max(0, Math.min((audio.duration || topicNow.dur) - 1, audio.currentTime + (act === 'back15' ? -15 : 30)));
      syncPlayer(); return;
    }
    if (act === 'speed') {
      const speeds = [1, 1.25, 1.5, 0.8];
      state.speed = speeds[(speeds.indexOf(state.speed) + 1) % speeds.length];
      audio.playbackRate = state.speed; store.set('speed', state.speed);
      el.textContent = `${state.speed} 倍速`; return;
    }
    if (act === 'dedic') { openDedication(); return; }
    if (act === 'dedic-close') { closeDedication(); return; }
    if (act === 'back') back();
    else if (act === 'dress') { state.dress = (state.dress + 1) % DRESSES.length; store.set('dress', state.dress); render(false); }
    else if (act === 'fav') {
      const id = state.chapterId;
      state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
      store.set('favs', [...state.favs]); render(false);
    }
    else if (act === 'bigger' || act === 'smaller') {
      state.scale = Math.max(-1, Math.min(3, state.scale + (act === 'bigger' ? 1 : -1)));
      store.set('scale', state.scale); render(false);
    }
  });

  // 安卓返回键：能退就退一层，退到首页再交给系统
  window.weiranBack = function () {
    if (dedicOpen) { closeDedication(); return true; }
    if (state.view === 'today') return false;
    if (history.length) back(); else { Object.assign(state, { view: 'today' }); render(true); }
    return true;
  };
  // App 切到后台时只存进度，不停播（像听播客一样，可以锁屏听）
  window.weiranPause = function () { savePos(true); };

  if (DEDICATION.length && !store.get('dedicated', false)) openDedication();
  render(true);
})();
</script>

<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const files = ["audio/vol1.m4a", "audio/vol2.m4a", "audio/vol3.m4a", "audio/vol4.m4a", "audio/vol5.m4a", "audio/vol6.m4a", "audio/vol7.m4a", "audio/vol8.m4a"];
  async function count() {
    try {
      const c = await caches.open('jingang-audio-v1');
      const keys = (await c.keys()).map((r) => new URL(r.url).pathname);
      return files.filter((f) => keys.some((k) => k.endsWith('/' + f))).length;
    } catch (e) { return 0; }
  }
  async function label(btn) {
    const n = await count();
    btn.textContent = n === files.length ? '八期都已存到本机 ✓' : (n ? '正在存：' + n + ' / ' + files.length : '全部存到本机，断网也能听');
    return n;
  }
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest && e.target.closest('#cache-all');
    if (!btn) return;
    const reg = await navigator.serviceWorker.ready;
    (navigator.serviceWorker.controller || reg.active).postMessage({ type: 'cache-audio', files });
    btn.textContent = '正在存：0 / ' + files.length;
    const timer = setInterval(async () => { if (await label(btn) === files.length) clearInterval(timer); }, 2000);
  });
  new MutationObserver(() => { const b = document.getElementById('cache-all'); if (b && !b.dataset.done) { b.dataset.done = '1'; label(b); } })
    .observe(document.body, { childList: true, subtree: true });
})();
</script>
